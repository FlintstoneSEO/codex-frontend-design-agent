      - paragraph [ref=f98e30]: Observed on August 7, 2026 and reconciled against the current published site. Any remaining contradiction or approval need is labelled where it appears.
    - region [ref=f98e31]:
      - generic [ref=f98e32]: 01 / Mission
      - generic [ref=f98e33]:
        - heading "Repair the breach and increase wealth equity." [level=2] [ref=f98e34]
        - paragraph [ref=f98e35]: The Justice League of Greater Lansing Michigan exists to repair the breach caused by the historical damage of slavery and its aftermath. In the spirit of repentance for the sin of racism, we seek to build relationships and facilitate reparations between houses of worship and collaborative partners to increase wealth equity for African Americans in the Greater Lansing Area.
        - paragraph [ref=f98e36]: The Justice League connects faith and racial justice through reparations, with predominantly white houses of worship participating in repair for the harms of slavery and unequal wealth accumulation.
        - paragraph [ref=f98e37]: Mission and vision reviewed against the published organization website on 2026-08-07.
    - region [ref=f98e38]:
      - generic [ref=f98e39]:
        - paragraph [ref=f98e40]: Public vision
        - heading "A locally governed, three-pillar model." [level=2] [ref=f98e41]
      - list [ref=f98e42]:
        - listitem [ref=f98e43]:
          - generic [ref=f98e44]: "01"
          - strong [ref=f98e45]: Build a reparations fund through faith-based, individual, corporate, and community contributions.
        - listitem [ref=f98e46]:
          - generic [ref=f98e47]: "02"
          - strong [ref=f98e48]: Use an African American Advisory Council to govern reparations distributions.
        - listitem [ref=f98e49]:
          - generic [ref=f98e50]: "03"
          - strong [ref=f98e51]: "Direct the work through three pillars: educational scholarships, homeownership, and business entrepreneurship."
      - link "Read the current vision statement (opens in a new tab)" [ref=f98e52] [cursor=pointer]:
