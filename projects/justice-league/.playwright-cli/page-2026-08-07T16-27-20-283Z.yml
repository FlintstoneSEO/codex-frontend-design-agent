                - text: View this milestone in the full current timeline
                - generic [ref=f81e104]: (opens in a new tab)
        - listitem [ref=f81e105]:
          - generic [ref=f81e106]:
            - time [ref=f81e107]: June 2023
            - generic [ref=f81e108]: Current-site record
          - article [ref=f81e109]:
            - heading "The apology moves to the Capitol lawn" [level=3] [ref=f81e110]
            - generic [ref=f81e111]:
              - paragraph [ref=f81e112]: On June 19–20, faith leaders and community members gathered at the Michigan State Capitol during Juneteenth to deliver a formal apology for slavery based on a Presbyterian Church (USA) litany of repentance.
              - paragraph [ref=f81e113]: The current timeline records participation from faith communities across the Lansing region and remarks from State Senator Sarah Anthony.
            - figure "The Juneteenth gathering brought the apology into a public civic setting. Image reused from the approved current Wix timeline." [ref=f81e114]:
              - img "State Senator Sarah Anthony speaking at the 2023 Capitol apology gathering" [ref=f81e115]
            - paragraph [ref=f81e117]:
              - link "View this milestone in the full current timeline (opens in a new tab)" [ref=f81e118] [cursor=pointer]:
                - /url: https://www.justiceleagueglm.org/timeline
                - text: View this milestone in the full current timeline
                - generic [ref=f81e119]: (opens in a new tab)
        - listitem [ref=f81e120]:
          - generic [ref=f81e121]:
            - time [ref=f81e122]: April–August 2023
            - generic [ref=f81e123]: Current-site record
          - article [ref=f81e124]:
            - heading "Congregations make early reparations commitments" [level=3] [ref=f81e125]
            - generic [ref=f81e126]:
              - paragraph [ref=f81e127]: The current timeline records a $20,000 commitment from First Presbyterian Church of Holt and a $7,000 payment from Red Cedar Friends Meeting.
              - paragraph [ref=f81e128]: It later records a total reparations payment of $173,260 connected with Edgewood United Church and a $130,470.62 contribution from All Saints Episcopal Church. These are dated historical commitments, not current fund balances.
            - paragraph [ref=f81e129]:
              - link "View this milestone in the full current timeline (opens in a new tab)" [ref=f81e130] [cursor=pointer]:
                - /url: https://www.justiceleagueglm.org/timeline
                - text: View this milestone in the full current timeline
