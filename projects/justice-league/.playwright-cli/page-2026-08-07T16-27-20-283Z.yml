        - paragraph [ref=f81e37]: Why this history matters
        - heading "Repair responds to structural harm." [level=2] [ref=f81e38]
      - generic [ref=f81e39]:
        - paragraph [ref=f81e40]: The current history page connects the racial wealth divide to slavery and its aftermath, including sharecropping, Jim Crow, redlining, unequal access to public benefits, and continuing structural racism.
        - paragraph [ref=f81e41]: It argues that structural problems require structural responses and calls faith communities to take a practical first step in acknowledgment, redress, relationship, and repair.
        - list "The organization’s three reparations pillars" [ref=f81e42]:
