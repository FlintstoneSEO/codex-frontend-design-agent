        - listitem [ref=f81e75]:
          - generic [ref=f81e76]:
            - time [ref=f81e77]: October 2022
            - generic [ref=f81e78]: Current-site record
          - article [ref=f81e79]:
            - heading "The first formal public presentation" [level=3] [ref=f81e80]
            - generic [ref=f81e81]:
              - paragraph [ref=f81e82]: "The organization hosted Rev. Jimmie R. Hawkins for public discussions of Unbroken and Unbowed: The History of Black Protest in America."
              - paragraph [ref=f81e83]: Events at Socialight Society and the Downtown Capital Area District Library introduced the reparations framework to a broader Greater Lansing audience.
            - figure "The October 2022 public presentation connected local reparations work with the history of Black protest and public witness. Image reused from the approved current Wix timeline." [ref=f81e84]:
              - img "Public presentation at Socialight Society in Lansing" [ref=f81e85]
            - paragraph [ref=f81e87]:
