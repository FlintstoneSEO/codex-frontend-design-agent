            - generic [ref=f81e177]: Current-site record
          - article [ref=f81e178]:
            - heading "The model is adopted in Kalamazoo" [level=3] [ref=f81e179]
            - generic [ref=f81e180]:
              - paragraph [ref=f81e181]: The Justice League of Greater Kalamazoo formally launched after preparatory meetings with Greater Lansing leadership.
              - paragraph [ref=f81e182]: The current site describes this as the first regional adoption of the faith-based structure, African American Advisory Council governance, and three reparations pillars.
            - figure "Kalamazoo became the first regional organization reported to adopt the Lansing model. Image reused from the approved current Wix timeline." [ref=f81e183]:
