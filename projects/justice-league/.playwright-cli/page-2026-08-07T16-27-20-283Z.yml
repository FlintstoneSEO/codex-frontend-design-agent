            - time [ref=f81e92]: January 2023
            - generic [ref=f81e93]: Current-site record
          - article [ref=f81e94]:
            - heading "A public apology at Lansing Reachout Christian Center" [level=3] [ref=f81e95]
            - generic [ref=f81e96]:
              - paragraph [ref=f81e97]: The Justice League coordinated an apology and reparations gathering at Lansing Reachout Christian Center on Lansing’s south side.
              - paragraph [ref=f81e98]: The current account describes the event as joining a liturgy of repentance with a public call for structural action.
            - figure "The Lansing Reachout gathering made acknowledgment and repair visible in a community setting. Image reused from the approved current Wix timeline." [ref=f81e99]:
              - img "Participants at the January 2023 apology event at Lansing Reachout Christian Center" [ref=f81e100]
            - paragraph [ref=f81e102]:
              - link "View this milestone in the full current timeline (opens in a new tab)" [ref=f81e103] [cursor=pointer]:
