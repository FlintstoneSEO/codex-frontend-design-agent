            - generic [ref=f81e63]: Current-site record
          - article [ref=f81e64]:
            - heading "A faith-rooted reparations model begins" [level=3] [ref=f81e65]
            - generic [ref=f81e66]:
              - paragraph [ref=f81e67]: The current timeline identifies Willye Bryan as the founder of the Justice League of Greater Lansing Michigan and places the organization’s founding in 2021.
              - paragraph [ref=f81e68]: It describes an African American Advisory Council overseeing a three-pillar framework focused on educational scholarships, homeownership, and business entrepreneurship.
            - figure "Willye Bryan, founder of the Justice League of Greater Lansing Michigan. Image reused from the approved current Wix timeline." [ref=f81e69]:
              - img "Portrait of Justice League founder Willye Bryan" [ref=f81e70]
            - paragraph [ref=f81e72]:
              - link "View this milestone in the full current timeline (opens in a new tab)" [ref=f81e73] [cursor=pointer]:
