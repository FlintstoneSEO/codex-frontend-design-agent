            - generic [ref=f81e147]: Current-site record
          - article [ref=f81e148]:
            - heading "The first reparations scholarships are awarded" [level=3] [ref=f81e149]
            - generic [ref=f81e150]:
              - paragraph [ref=f81e151]: The current timeline reports that ten African American graduates received $5,000 each in the first reparations scholarship cohort.
              - paragraph [ref=f81e152]: Students were selected through essays about the racial wealth gap, interviews, and verified enrollment. The recognition gathering brought together students, families, clergy, and Justice League leadership.
            - figure "The inaugural scholarship cohort marked the first reported distribution through the education pillar. Image reused from the approved current Wix timeline." [ref=f81e153]:
              - img "The 2024 Justice League reparations scholarship recognition gathering" [ref=f81e154]
            - paragraph [ref=f81e156]:
