            - time [ref=f81e161]: April 2025
            - generic [ref=f81e162]: Current-site record
          - article [ref=f81e163]:
            - heading "Reparations support a first home build" [level=3] [ref=f81e164]
            - generic [ref=f81e165]:
              - paragraph [ref=f81e166]: In partnership with the Eastside Community Action Center, the Justice League supported construction of a home for a senior African American first-time homebuyer on McCullough Street.
              - paragraph [ref=f81e167]: The current timeline reports that nearly $70,000 in reparations funds supported construction while the partner organization provided homeowner preparation and transition support.
            - figure "The McCullough Street project moved the homeownership pillar into a tangible local asset. Image reused from the approved current Wix timeline." [ref=f81e168]:
              - img "Reparations-supported home construction on McCullough Street in Lansing" [ref=f81e169]
