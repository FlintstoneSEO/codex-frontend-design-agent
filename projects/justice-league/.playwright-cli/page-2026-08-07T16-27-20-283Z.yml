            - time [ref=f81e134]: January–April 2024
            - generic [ref=f81e135]: Current-site record
          - article [ref=f81e136]:
            - heading "Public education reaches local and national audiences" [level=3] [ref=f81e137]
            - generic [ref=f81e138]:
              - paragraph [ref=f81e139]: The Justice League joined a screening and panel for The Cost of Inheritance, followed by the first How Did We Get Here? community dialogue at the East Lansing Public Library.
              - paragraph [ref=f81e140]: In April, NPR reported on the Greater Lansing faith-based reparations effort, extending attention beyond the region.
            - paragraph [ref=f81e141]:
              - link "View this milestone in the full current timeline (opens in a new tab)" [ref=f81e142] [cursor=pointer]:
