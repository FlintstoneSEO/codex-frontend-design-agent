    - region [ref=e45]:
      - generic [ref=e46]: 01 / Mission
      - generic [ref=e47]:
        - heading "Repair the breach and increase wealth equity." [level=2] [ref=e48]
        - paragraph [ref=e49]: The Justice League of Greater Lansing Michigan exists to repair the breach caused by the historical damage of slavery and its aftermath. In the spirit of repentance for the sin of racism, we seek to build relationships and facilitate reparations between houses of worship and collaborative partners to increase wealth equity for African Americans in the Greater Lansing Area.
        - paragraph [ref=e50]: The Justice League connects faith and racial justice through reparations, with predominantly white houses of worship participating in repair for the harms of slavery and unequal wealth accumulation.
        - paragraph [ref=e51]: Mission and vision reviewed against the published organization website on 2026-08-07.
    - region [ref=e52]:
      - generic [ref=e53]:
        - paragraph [ref=e54]: Public vision
        - heading "A locally governed, three-pillar model." [level=2] [ref=e55]
      - list [ref=e56]:
        - listitem [ref=e57]:
          - generic [ref=e58]: "01"
          - strong [ref=e59]: Build a reparations fund through faith-based, individual, corporate, and community contributions.
        - listitem [ref=e60]:
          - generic [ref=e61]: "02"
          - strong [ref=e62]: Use an African American Advisory Council to govern reparations distributions.
        - listitem [ref=e63]:
          - generic [ref=e64]: "03"
          - strong [ref=e65]: "Direct the work through three pillars: educational scholarships, homeownership, and business entrepreneurship."
