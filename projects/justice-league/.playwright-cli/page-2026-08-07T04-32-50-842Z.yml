        - img "Willye Bryan, founder of the Justice League of Greater Lansing Michigan" [ref=f5e56]
        - paragraph [ref=f5e57]: Willye Bryan · Founder
      - generic [ref=f5e58]:
        - paragraph [ref=f5e59]: The work begins with a question
        - heading "What can people of faith do about the injustice in front of us?" [level=2] [ref=f5e60]
        - paragraph [ref=f5e61]: Willye Bryan describes the Justice League as growing from 2021 conversations about racial disparities, responsibility, and the need to move from study toward repair in Greater Lansing.
        - paragraph [ref=f5e62]: Her account connects repentance with practical local relationships—especially between houses of worship and collaborative partners—and with reparative work focused on education, homeownership, and entrepreneurship.
        - blockquote [ref=f5e63]:
          - paragraph [ref=f5e64]: “I can stand up, speak out, and apologize to those who continue to be harmed.”
        - link "Read “The Art of Repair” in City Pulse (opens in a new tab)" [ref=f5e65] [cursor=pointer]:
          - /url: https://www.lansingcitypulse.com/stories/the-art-of-repair,125610
