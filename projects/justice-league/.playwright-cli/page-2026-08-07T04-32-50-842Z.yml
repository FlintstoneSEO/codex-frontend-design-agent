    - region [ref=f5e43]:
      - generic [ref=f5e44]: "01"
      - generic [ref=f5e45]:
        - paragraph [ref=f5e46]: Our mission
        - heading "Repair is both a responsibility and a relationship." [level=2] [ref=f5e47]
      - generic [ref=f5e48]:
        - paragraph [ref=f5e49]: The Justice League of Greater Lansing Michigan exists to repair the breach caused by the historical damage of slavery and its aftermath. In the spirit of repentance for the sin of racism, we seek to build relationships and facilitate reparations between houses of worship and collaborative partners to increase wealth equity for African Americans in the Greater Lansing Area.
