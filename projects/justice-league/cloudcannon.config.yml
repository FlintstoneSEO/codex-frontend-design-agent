paths:
  static: public
  uploads: public/images
timezone: America/New_York
markdown:
  engine: commonmark
  options:
    gfm: true

collections_config:
  pages:
    path: src/content/pages
    name: Pages
    icon: wysiwyg
    url: "{url}"
    disable_add: true
    _enabled_editors:
      - visual
      - data
    preview:
      text:
        - key: name
        - Page
      subtext:
        - key: url
    _inputs:
      name:
        hidden: true
      url:
        hidden: true
      source_path:
        hidden: true
      seo_title:
        type: text
        label: SEO Title
        comment: The browser and search-result title. Keep it descriptive and distinct.
      meta_description:
        type: textarea
        label: Meta Description
        comment: A concise summary for search results and link previews.
      hero:
        type: object
        label: Page Hero
        comment: Homepage and Reparations page. Layout and heading hierarchy remain developer controlled.
      definition:
        type: object
        label: Reparations Definition
        comment: Reparations page only. Keep claims aligned with approved Justice League source material.
      history_heading:
        type: text
        label: Historical Context Heading
      model_heading:
        type: text
        label: Local Model Heading
      pathways_heading:
        type: text
        label: Pathways Heading
      faith_heading:
        type: text
        label: Faith Section Heading
      action:
        type: object
        label: Closing Action
        comment: CTA labels and internal destinations for the Reparations page.

collection_groups:
  - heading: Content
    collections:
      - pages

_editables:
  content:
    allow_custom_markup: false
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true

_structures:
  homepage_hero:
    values:
      - label: Homepage Hero
        value:
          eyebrow: ""
          heading: ""
          description: ""
          image: ""
          image_alt: ""
          primary_cta_text: ""
          primary_cta_url: ""
          secondary_cta_text: ""
          secondary_cta_url: ""
        _inputs:
          eyebrow:
            type: text
          heading:
            type: text
          description:
            type: textarea
          image:
            type: image
            options:
              paths:
                uploads: public/images
                static: public
          image_alt:
            type: text
            comment: Describe the people, place, and activity shown; do not repeat the heading.
          primary_cta_text:
            type: text
          primary_cta_url:
            type: url
          secondary_cta_text:
            type: text
          secondary_cta_url:
            type: url
