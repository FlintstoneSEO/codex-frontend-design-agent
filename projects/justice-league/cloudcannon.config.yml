paths:
  static: public
  uploads: public/images
timezone: America/New_York
markdown:
  engine: commonmark
  options:
    gfm: true

collections_config:
  pages:
    path: src/content/pages
    name: Pages
    icon: wysiwyg
    url: "{url}"
    disable_add: true
    _enabled_editors:
      - visual
      - data
    preview:
      text:
        - key: name
        - Page
      subtext:
        - key: url
    _inputs:
      name:
        hidden: true
      url:
        hidden: true
      source_path:
        hidden: true
      seo_title:
        type: text
        label: SEO Title
        comment: The browser and search-result title. Keep it descriptive and distinct.
      meta_description:
        type: textarea
        label: Meta Description
        comment: A concise summary for search results and link previews.
      hero:
        type: object
        label: Homepage Hero
        comment: Homepage only. The layout, crop, and contrast overlay remain developer controlled.
        options:
          structures: _structures.homepage_hero
      hero_word_cloud:
        type: object
        label: Hero Word Cloud
        comment: Homepage only. Uses controlled sizes and brand-safe color roles.
        options:
          structures: _structures.hero_word_cloud

_select_data:
  word_sizes:
    - small
    - medium
    - large
    - featured
  word_tones:
    - light
    - green
    - gold
    - red
    - muted

collection_groups:
  - heading: Content
    collections:
      - pages

_editables:
  content:
    allow_custom_markup: false
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true

_structures:
  homepage_hero:
    values:
      - label: Homepage Hero
        value:
          eyebrow: ""
          heading: ""
          description: ""
          image: ""
          image_alt: ""
          primary_cta_text: ""
          primary_cta_url: ""
          secondary_cta_text: ""
          secondary_cta_url: ""
        _inputs:
          eyebrow:
            type: text
          heading:
            type: text
          description:
            type: textarea
          image:
            type: image
            options:
              paths:
                uploads: public/images
                static: public
          image_alt:
            type: text
            comment: Describe the people, place, and activity shown; do not repeat the heading.
          primary_cta_text:
            type: text
          primary_cta_url:
            type: url
          secondary_cta_text:
            type: text
          secondary_cta_url:
            type: url
  hero_word_cloud:
    values:
      - label: Hero Word Cloud
        preview:
          text:
            - Hero Word Cloud
          icon:
            - format_size
        value:
          enabled: true
          words: []
        _inputs:
          enabled:
            type: switch
            comment: Show or hide the word cloud without deleting its terms.
          words:
            type: array
            options:
              structures: _structures.hero_word_cloud_words
  hero_word_cloud_words:
    values:
      - label: Word
        preview:
          text:
            - key: text
            - Word
          icon:
            - title
        value:
          text: ""
          size: medium
          tone: light
          emphasis: false
        _inputs:
          text:
            type: text
          size:
            type: select
            options:
              values: _select_data.word_sizes
          tone:
            type: select
            options:
              values: _select_data.word_tones
          emphasis:
            type: switch
